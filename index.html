<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Punto D'Encuentro</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family:'Outfit', sans-serif;
    background:#f5ede1;
    color:#3d2a1d;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(2rem, 6vw, 3.2rem);
    letter-spacing:-.02em;
    margin-bottom:10px;
  }

  h1 span{ color:#b5542f; font-style:italic; }

  p{
    font-weight:300;
    color:#7a5c48;
    margin-bottom:32px;
    font-size:1rem;
  }

  a{ text-decoration:none; }

  button{
    font-family:'Outfit', sans-serif;
    font-size:.85rem;
    font-weight:500;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:16px 40px;
    background:#3d2a1d;
    color:#f5ede1;
    border:none;
    border-radius:40px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 25px rgba(61,42,29,.2);
  }

  button:hover{
    background:#b5542f;
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(181,84,47,.35);
  }
</style>
</head>
<body>

<h1>Punto <span>D'</span>Encuentro</h1>
<p>Pulsa el botón para entrar en la cafetería.</p>

<a href="cafeteria-pagina/index.html">
  <button>Entrar en la cafetería</button>
</a>

</body>
</html>
